<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="t d">
<title id="t">A Better AI Workflow</title><desc id="d">A weak AI workflow compared with a stronger learning-oriented workflow.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f2747"/></marker></defs>
<style>.box{fill:#f8fafc;stroke:#0f2747;stroke-width:4}.weak{fill:#fff1f2;stroke:#be123c;stroke-width:4}.strong{fill:#ecfdf5;stroke:#15803d;stroke-width:4}.txt{fill:#0f2747;font:700 30px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:middle}.head{font-size:34px}.arrow{stroke:#0f2747;stroke-width:5;marker-end:url(#a)}</style>
<rect class="weak" x="85" y="30" width="630" height="78" rx="24"/><text class="txt head" x="400" y="69">Weak</text>
<rect class="box" x="125" y="140" width="550" height="78" rx="22"/><text class="txt" x="400" y="179">Prompt</text><line class="arrow" x1="400" y1="221" x2="400" y2="257"/>
<rect class="box" x="125" y="272" width="550" height="78" rx="22"/><text class="txt" x="400" y="311">AI Generates Code</text><line class="arrow" x1="400" y1="353" x2="400" y2="389"/>
<rect class="box" x="125" y="404" width="550" height="78" rx="22"/><text class="txt" x="400" y="443">Copy and Run</text>
<rect class="strong" x="85" y="545" width="630" height="78" rx="24"/><text class="txt head" x="400" y="584">Strong</text>
<rect class="box" x="125" y="655" width="550" height="66" rx="20"/><text class="txt" x="400" y="688">Think</text><line class="arrow" x1="400" y1="724" x2="400" y2="752"/>
<rect class="box" x="125" y="767" width="550" height="66" rx="20"/><text class="txt" x="400" y="800">Design</text><line class="arrow" x1="400" y1="836" x2="400" y2="864"/>
<rect class="box" x="125" y="879" width="550" height="66" rx="20"/><text class="txt" x="400" y="912">Ask AI</text><line class="arrow" x1="400" y1="948" x2="400" y2="976"/>
<rect class="box" x="125" y="991" width="550" height="66" rx="20"/><text class="txt" x="400" y="1024">Review → Test → Learn</text>
</svg>