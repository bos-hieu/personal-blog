<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="t d">
<title id="t">From Coder to Architect</title><desc id="d">A traditional coding loop compared with an architecture loop.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f2747"/></marker></defs>
<style>.card{fill:#f8fafc;stroke:#0f2747;stroke-width:4}.head{fill:#e8f0fb;stroke:#0f2747;stroke-width:4}.txt{fill:#0f2747;font:700 30px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{font-size:27px}.arrow{stroke:#0f2747;stroke-width:5;marker-end:url(#a)}</style>
<rect class="head" x="85" y="25" width="630" height="78" rx="24"/><text class="txt" x="400" y="64">Traditional Loop</text>
<rect class="card" x="125" y="135" width="550" height="82" rx="22"/><text class="txt" x="400" y="176">Task</text><line class="arrow" x1="400" y1="220" x2="400" y2="260"/>
<rect class="card" x="125" y="275" width="550" height="82" rx="22"/><text class="txt" x="400" y="316">Write Code</text><line class="arrow" x1="400" y1="360" x2="400" y2="400"/>
<rect class="card" x="125" y="415" width="550" height="82" rx="22"/><text class="txt" x="400" y="456">Ship</text>
<rect class="head" x="85" y="555" width="630" height="78" rx="24"/><text class="txt" x="400" y="594">Architecture Loop</text>
<g><rect class="card" x="125" y="665" width="550" height="72" rx="20"/><text class="txt small" x="400" y="701">Problem</text><line class="arrow" x1="400" y1="740" x2="400" y2="770"/>
<rect class="card" x="125" y="785" width="550" height="72" rx="20"/><text class="txt small" x="400" y="821">Constraints</text><line class="arrow" x1="400" y1="860" x2="400" y2="890"/>
<rect class="card" x="125" y="905" width="550" height="72" rx="20"/><text class="txt small" x="400" y="941">Architecture Options</text><line class="arrow" x1="400" y1="980" x2="400" y2="1010"/>
<rect class="card" x="125" y="1025" width="550" height="72" rx="20"/><text class="txt small" x="400" y="1061">Trade-offs → Decision → AI Writes Code</text><line class="arrow" x1="400" y1="1100" x2="400" y2="1125"/>
<rect class="card" x="125" y="1138" width="550" height="72" rx="20" transform="translate(0,-55)"/><text class="txt small" x="400" y="1119">Review / Test / Improve</text></g>
</svg>