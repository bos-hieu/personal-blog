<rect class="box" x="555" y="435" width="200" height="120" rx="24"/><text class="txt" x="655" y="495"><tspan x="655" dy="-18">Gemini</tspan><tspan x="655" dy="38">CLI</tspan></text>
<rect class="call" x="65" y="600" width="670" height="70" rx="22"/><text class="txt" x="400" y="635">Knowledge should outlive any single AI tool.</text>
